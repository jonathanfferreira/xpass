"""
Lists all available partners.
"""
query ListPartners @auth(level: PUBLIC) {
  partners {
    id
    name
    category
    basePrice
    imageUrl
    address
    latitude
    longitude
  }
}

"""
Retrieves a user's profile by ID.
"""
query GetUserProfile($id: String!) @auth(level: USER) {
  user(id: $id) {
    id
    name
    credits
    role
  }
}

"""
Lists all bookings for a specific user, ordered by creation date.
"""
query ListUserBookings($id: String!) @auth(level: USER) {
  bookings(where: {user: {id: {eq: $id}}}, orderBy: [{createdAt: DESC}]) {
    id
    status
    cost
    createdAt
    class {
      name
      startTime
      endTime
      partner {
        name
        address
      }
    }
  }
}

"""
Lists classes for a specific partner, ordered by start time.
"""
query ListClassesByPartner($partnerId: UUID!) @auth(level: PUBLIC) {
  classes(where: {partner: {id: {eq: $partnerId}}}, orderBy: [{startTime: ASC}]) {
    id
    name
    startTime
    endTime
    capacity
    bookedCount
    offPeakPrice
  }
}

"""
Retrieves details of a specific partner by ID.
"""
query GetPartnerById($id: UUID!) @auth(level: PUBLIC) {
  partner(id: $id) {
    id
    name
    category
    description
    imageUrl
    basePrice
    address
    latitude
    longitude
  }
}
